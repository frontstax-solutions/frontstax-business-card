<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Deepak Raina - Founder & CEO, Frontstax Solutions">

    <meta name="theme-color"
          content="#0b1f3a">

    <title>Deepak Raina | Frontstax Solutions</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f7;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 450px;
            margin: 40px auto;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .header {
            background: linear-gradient(135deg, #071b33, #123e68);
            padding: 35px 25px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: white;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 22px;
        }

        .company {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.85;
        }

        .content {
            padding: 30px 25px;
            text-align: center;
        }

        .name {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .designation {
            color: #37658f;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .contact {
            margin: 12px 0;
            font-size: 17px;
        }

        .contact a {
            text-decoration: none;
            color: #172033;
        }

        .buttons {
            display: grid;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            display: block;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            background: #0d3154;
            color: white;
        }

        .button.secondary {
            background: #eef2f7;
            color: #172033;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #eee;
        }

        @media (max-width: 500px) {

            .card {
                margin: 0;
                min-height: 100vh;
                border-radius: 0;
            }

        }

    </style>
</head>

<body>

<div class="card">

    <div class="header">

        <img
            src="logo.png"
            alt="Frontstax Solutions Logo"
            class="logo"
        >

        <div class="company">
            Frontstax Solutions
        </div>

        <div class="tagline">
            Your Partner In Digital Innovation
        </div>

    </div>


    <div class="content">

        <div class="name">
            Deepak Raina
        </div>

        <div class="designation">
            Founder & CEO
        </div>


        <div class="contact">
            📞
            <a href="tel:+971553805362">
                +971 553805362
            </a>
        </div>


        <div class="buttons">

            <a
                class="button"
                href="tel:+971553805362">
                Call Now
            </a>


            <a
                class="button secondary"
                href="https://wa.me/971553805362"
                target="_blank">
                WhatsApp
            </a>


            <a
                class="button secondary"
                href="deepak.vcf"
                download>
                Save Contact
            </a>

        </div>

    </div>


    <div class="footer">
        © Frontstax Solutions
    </div>

</div>

</body>
</html>
